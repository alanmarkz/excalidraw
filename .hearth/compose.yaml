services:
  web:
    depends_on:
    - room
    restart: unless-stopped
    ports:
    - 127.0.0.1:${HEARTH_PORT_WEB}:80
    volumes:
    - ./files/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    build:
      context: ${HEARTH_SOURCE}/excalidraw
      dockerfile_inline: |-
        FROM node:24-bookworm AS build
        WORKDIR /opt/node_app
        COPY . .
        RUN yarn --frozen-lockfile --network-timeout 600000
        ENV NODE_ENV=production
        ENV VITE_APP_WS_SERVER_URL=/
        ENV VITE_APP_ENABLE_TRACKING=false
        RUN yarn build:app:docker

        FROM nginx:1.27.3-alpine
        COPY --from=build /opt/node_app/excalidraw-app/build /usr/share/nginx/html
  room:
    volumes:
    - room_data:/app/data
    restart: unless-stopped
    init: true
    env_file: app.env
    environment:
      PORT: '3002'
      CORS_ORIGIN: ${HEARTH_URL}
      STORAGE_DIR: /app/data
    build:
      context: ${HEARTH_SOURCE}/excalidraw-room
      dockerfile_inline: |-
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json yarn.lock ./
        RUN yarn install --frozen-lockfile
        COPY tsconfig.json ./
        COPY src ./src
        RUN yarn build

        FROM node:22-alpine
        WORKDIR /app
        COPY package.json yarn.lock ./
        RUN yarn install --frozen-lockfile --production && yarn cache clean
        COPY --from=build /app/dist ./dist
        ENV NODE_ENV=production
        EXPOSE 3002
        CMD ["node", "dist/index.js"]
volumes:
  room_data: null
